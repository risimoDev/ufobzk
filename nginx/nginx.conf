# ═══════════════════════════════════════════════════
#  VPNBZK — Nginx reverse-proxy + SSL termination
#  Шаблон: подставь ${DOMAIN}, whitelist через /etc/nginx/whitelist.conf
#  через envsubst в docker-compose entrypoint
# ═══════════════════════════════════════════════════

# ── Глобальные ──

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;
    client_max_body_size 10m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Gzip сжатие для API и статики
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_vary on;
    gzip_proxied any;

    # Блокировка по количеству соединений с одного IP.
    # ВАЖНО: лимит НЕ ставим глобально — иначе он режет и VPN-туннели
    # (XHTTP в packet-up открывает десятки коротких соединений, gRPC/WS —
    # долгоживущие стримы). 64 соединения легко исчерпываются под нагрузкой →
    # периодические обрывы («то работает, то нет»). Лимит применяется точечно
    # только в `location /` (веб-приложение), см. ниже.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # Логи
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    # Скрыть версию
    server_tokens off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=sub:10m rate=10r/m;
    limit_req_status 429;

    # ── Upstream'ы ──

    upstream ufo_app {
        server ufo-app:8000;
        keepalive 32;
    }

    upstream xray_ws {
        server xray:8443;
        keepalive 64;
        keepalive_timeout 3600s;
        keepalive_requests 100000;
    }

    upstream xray_xhttp {
        server xray:8444;
        keepalive 64;
        keepalive_timeout 3600s;
        keepalive_requests 100000;
    }

    upstream xray_grpc {
        server xray:8445;
        keepalive 64;
        keepalive_timeout 3600s;
        keepalive_requests 100000;
    }

    # ── HTTP → HTTPS redirect + ACME challenge ──

    server {
        listen 80;
        server_name ${DOMAIN};

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Основной HTTPS-сервер ──

    server {
        listen 443 ssl;
        http2 on;
        # Увеличиваем с дефолтных 1000 — иначе nginx форсирует переподключение
        # соединения после 1000 запросов, что рвёт долгоживущие gRPC-стримы.
        # http2_max_requests устарел в nginx 1.25+ → keepalive_requests теперь
        # управляет и лимитом запросов на HTTP/2-соединение.
        keepalive_requests 100000;
        server_name ${DOMAIN};

        # ── SSL ──
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # Security headers
        add_header X-Frame-Options            "DENY" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        # X-XSS-Protection устарел — CSP в app middleware заменяет его

        # ── Блокировка сканеров ──
        location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|admin\.php|\.env|\.git|\.aws|\.ssh|actuator|shell|config\.php) {
            access_log off;
            return 444;
        }

        # ── /admin — админ-панель (защита на уровне приложения) ──
        location /admin {
            proxy_pass http://ufo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── /login — rate-limited ──
        location /login {
            limit_req zone=login burst=3 nodelay;

            proxy_pass http://ufo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── /sub/ — подписки VPN ──
        location /sub/ {
            limit_req zone=sub burst=5 nodelay;

            proxy_pass http://ufo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── / — всё остальное → UFO-приложение ──
        location / {
            limit_req zone=general burst=20 nodelay;
            limit_conn conn_per_ip 64;  # лимит соединений ТОЛЬКО для веб-приложения

            proxy_pass http://ufo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Статика UFO-приложения ──
        location /static/ {
            proxy_pass http://ufo_app/static/;
            proxy_cache_valid 200 1d;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── VLESS WebSocket — проксирование в Xray ядро ──
        # Трафик приходит как обычный HTTPS, nginx проксирует по path
        # в Xray ядро. Для DPI это выглядит как обычный сайт.
        location /vless-ws {
            proxy_pass http://xray_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            # Переопределяем глобальный send_timeout 10s — при заполненном
            # буфере клиента (медленная сеть) 10с недостаточно для VPN
            send_timeout        86400s;
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_buffering     off;
            proxy_cache         off;
            tcp_nodelay         on;
        }

        # ── VLESS XHTTP — новый транспорт, лучше WS для DPI (Xray 1.8+) ──
        location /xhttp {
            proxy_pass http://xray_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # keepalive_timeout: глобальный 65s закрывает HTTPS-соединение при паузе > 65с
            keepalive_timeout           86400s;
            client_body_timeout         86400s;
            send_timeout                86400s;
            proxy_read_timeout          86400s;
            proxy_send_timeout          86400s;
            proxy_connect_timeout       10s;
            proxy_request_buffering     off;
            proxy_buffering             off;
            proxy_cache                 off;
            tcp_nodelay                 on;
        }

        # ── VLESS gRPC — HTTP/2 транспорт ──
        location ~ ^/VpnService {
            grpc_pass grpc://xray_grpc;
            grpc_set_header Host            $host;
            grpc_set_header X-Real-IP       $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_read_timeout  86400s;
            grpc_send_timeout  86400s;
            grpc_socket_keepalive on;
            keepalive_timeout   86400s;
            client_body_timeout 86400s;
            send_timeout        86400s;
        }
    }
}
