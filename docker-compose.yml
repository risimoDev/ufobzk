# ═══════════════════════════════════════════
#  VPNBZK — Production Docker Compose
#  UFO site + Xray core + Nginx + Certbot
# ═══════════════════════════════════════════

services:
  # ── Nginx — reverse proxy + SSL ──
  nginx:
    image: nginx:1.27-alpine
    container_name: ufobzk-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    environment:
      - DOMAIN=${DOMAIN}
    # Nginx кеширует сертификат в памяти при старте — после certbot renew он
    # продолжает отдавать СТАРЫЙ (просроченный) cert до перезагрузки конфига.
    # Фоновый цикл перечитывает сертификаты каждые 6ч.
    entrypoint: "/bin/sh -c 'envsubst \"\\$$DOMAIN\" < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      ufo-app:
        condition: service_healthy
      xray:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qS -O /dev/null http://127.0.0.1:80/ 2>&1 | grep -qE '301|200' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - frontend
      - backend

  # ── Certbot — SSL auto-renew ──
  certbot:
    image: certbot/certbot:latest
    container_name: ufobzk-certbot
    # Без restart-политики цикл автообновления не переживает reboot сервера и
    # не поднимается деплой-скриптами (они делают up -d --no-deps ufo-app).
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Первый запуск: получить сертификат
    # docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d $DOMAIN --email $EMAIL --agree-tos --no-eff-email
    # Автообновление через entrypoint:
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - frontend

  # ── Xray — VPN ядро ──
  xray:
    image: teddysun/xray:latest
    container_name: ufobzk-xray
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # REALITY порт — прямое подключение без CDN
      - "${REALITY_PORT:-2053}:443"
    expose:
      - "8443"
      - "8444"
      - "8445"
      - "10085"
    volumes:
      - xray-config:/etc/xray
      - xray-logs:/var/log/xray
    # Ждём конфиг от ufo-app (он создаётся при старте приложения)
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "until [ -f /etc/xray/config.json ]; do echo 'Waiting for xray config...'; sleep 2; done; exec xray run -config /etc/xray/config.json",
      ]
    networks:
      - backend

  # ── mtg — MTProto-прокси для Telegram ──
  # Конфиг (секрет) пишется приложением в общий volume mtg-config;
  # контейнер ждёт файл и применяет его (рестарт через docker-socket из ufo-app).
  mtg:
    image: nineseconds/mtg:2
    container_name: ufobzk-mtg
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Публикуемый порт MTProto (контейнер слушает 3128)
      - "${MTPROTO_PORT:-8765}:3128"
    volumes:
      - mtg-config:/etc/mtg
    # Образ mtg distroless (нет /bin/sh) — запускаем бинарь напрямую.
    # Конфиг (секрет) пишет приложение в общий том mtg-config из админки.
    # Пока config.toml нет — контейнер падает и перезапускается (restart:
    # unless-stopped) до появления файла; после генерации секрета стартует штатно.
    command: ["run", "/etc/mtg/config.toml"]
    networks:
      - backend

  # ── UFO App — FastAPI приложение ──
  ufo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ufobzk-app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - XRAY_CONFIG_PATH=/etc/xray/config.json
      - MTG_CONFIG_PATH=/etc/mtg/config.toml
    volumes:
      - app-data:/project/data
      - xray-config:/etc/xray
      - mtg-config:/etc/mtg
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      xray:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - backend

# ── Сети ──
networks:
  frontend:
    driver: bridge
  # backend с IPv6: нужен для GEO_IPV6 — выхода гео-доменов через IPv6 главного
  # сервера (Google метит как RU только его IPv4, IPv6 видит как PL). Без этого
  # freedom-аутбаунд с domainStrategy UseIPv6 падает с "network is unreachable".
  # Требует Docker 26+ (в более старых нужен "ipv6": true в /etc/docker/daemon.json).
  backend:
    driver: bridge
    enable_ipv6: true

# ── Тома ──
volumes:
  app-data:
  xray-config:
  xray-logs:
  mtg-config:
  certbot-webroot:
  certbot-certs:
  nginx-logs:
